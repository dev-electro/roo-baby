<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#0E0D14" />
		<meta name="background-color" content="#0E0D14" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="description" content="ROO — World's first multimodal baby cry analyzer powered by Gemma 4." />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.json" />

		<!-- Font perf: preconnect first, then load with display=swap -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="preload"
			as="style"
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap"
		/>
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap"
			media="print"
			onload="this.media='all'"
		/>
		<noscript>
			<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />
		</noscript>

		<!-- Critical inline CSS: prevent FOUC, set bg immediately -->
		<style>
			:root { --bg: #05050A; --text: #F8FAFA; }
			[data-theme="light"] { --bg: #F8FAFA; --text: #05050A; }
			*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
			html { -webkit-font-smoothing: antialiased; font-size: clamp(16px, 1.2vw + 12px, 20px); }
			body {
				background: var(--bg);
				color: var(--text);
				font-family: 'Inter', -apple-system, system-ui, sans-serif;
				min-height: 100dvh;
				overflow-x: hidden;
			}
		</style>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
