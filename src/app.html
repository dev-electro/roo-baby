<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-6PL007WZ76"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-6PL007WZ76');
  </script>
  
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#09090B" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#F8F8FA" media="(prefers-color-scheme: light)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="ROO — World's first multimodal baby cry analyzer powered by Gemma 4." />
  <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
  <link rel="manifest" href="%sveltekit.assets%/manifest.json" />

  <!--
    CRITICAL: Inline blocking script — sets data-theme before any CSS renders.
    This prevents the white flash when user has saved 'light' theme preference.
    Must be before any stylesheets.
  -->
  <script>
    (function() {
      try {
        var t = localStorage.getItem('roo-theme');
        document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
      } catch(e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>

  <!-- Font perf: preconnect first, then load with display=swap -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;700&display=swap" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;700&display=swap"
    media="print" onload="this.media='all'" />
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet" />
  </noscript>

  <!-- Critical inline CSS: zero FOUC — must match app.css :root values exactly -->
  <style>
    :root {
      --bg: #17161A;
      --text: #F4F4F5;
      --topbar-bg: rgba(23,22,26,.88);
    }
    [data-theme="light"] {
      --bg: #FCFAFD;
      --text: #0A0A0F;
      --topbar-bg: rgba(252,250,253,.92);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Nunito', -apple-system, system-ui, sans-serif;
      min-height: 100dvh;
      overflow-x: hidden;
    }
  </style>

  %sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover">
  <div style="display: contents">%sveltekit.body%</div>
</body>

</html>
